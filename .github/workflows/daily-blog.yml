name: Daily Finance Blog

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST — runs every day
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      posts_per_day:
        description: "Number of posts to generate (1-3)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate blog posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTS_PER_DAY: ${{ github.event.inputs.posts_per_day || '3' }}
        run: python scripts/generate_blog.py

      - name: Commit and push if new posts
        run: |
          git config user.name  "Zentra Content Bot"
          git config user.email "bot@zentraai.in"
          git add blog/
          git diff --cached --quiet && echo "No new posts today." || \
            git commit -m "content: auto-generate finance blog posts $(date -u +%Y-%m-%d)"
          git push
