<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Test Suite</title>
  <link rel="stylesheet" href="style.css" />
  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <span class="header-icon">⚡</span>
      <span class="header-title">AI Test Suite</span>
      <span class="header-sub">Powered by Claude</span>
    </div>
    <div class="header-actions" id="header-actions">
      <button class="btn btn-ghost" id="btn-dl-md" onclick="downloadMarkdown()" disabled>
        ↓ Markdown
      </button>
      <button class="btn btn-primary" id="btn-dl-pdf" onclick="exportPDF()" disabled>
        ↓ PDF
      </button>
    </div>
  </header>

  <!-- ── Layout ─────────────────────────────────────────────────── -->
  <div class="layout">

    <!-- ── Sidebar ──────────────────────────────────────────────── -->
    <aside class="sidebar">

      <!-- Target section -->
      <div class="sidebar-section">
        <div class="sidebar-label">Target</div>
        <div class="target-toggle" id="target-toggle">
          <button class="toggle-btn active" data-type="url" onclick="setTargetType('url')">URL</button>
          <button class="toggle-btn" data-type="path" onclick="setTargetType('path')">File Path</button>
        </div>
        <input
          id="target-input"
          type="text"
          class="text-input"
          placeholder="https://example.com"
          spellcheck="false"
        />
        <div class="target-hint" id="target-hint">Enter a web URL to test a live site.</div>
      </div>

      <!-- Agents section -->
      <div class="sidebar-section agents-section">
        <div class="sidebar-label-row">
          <span class="sidebar-label">Test Agents</span>
          <div class="agent-controls">
            <button class="btn-link" onclick="selectAll()">All</button>
            <span class="divider">·</span>
            <button class="btn-link" onclick="selectNone()">None</button>
          </div>
        </div>
        <div class="agent-list" id="agent-list">
          <div class="agents-loading">Loading agents…</div>
        </div>
      </div>

      <!-- Run button + status -->
      <div class="sidebar-footer">
        <button class="btn btn-run" id="run-btn" onclick="startRun()">
          <span class="run-icon">▶</span> Run Analysis
        </button>
        <div class="run-status" id="run-status">
          <span class="status-dot idle" id="status-dot"></span>
          <span class="status-text" id="status-text">Ready</span>
        </div>
      </div>

    </aside>

    <!-- ── Main content ──────────────────────────────────────────── -->
    <main class="main">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" id="tab-log-btn" onclick="switchTab('log')">
          Live Log
          <span class="tab-badge" id="log-count">0</span>
        </button>
        <button class="tab" id="tab-report-btn" onclick="switchTab('report')">
          Report
          <span class="tab-badge success hidden" id="report-badge">✓</span>
        </button>
      </div>

      <!-- Log panel -->
      <div class="tab-panel" id="panel-log">
        <div class="log-container" id="log-container">
          <div class="log-empty">
            <div class="log-empty-icon">📋</div>
            <div>Select agents and a target, then click <strong>Run Analysis</strong>.</div>
          </div>
        </div>
      </div>

      <!-- Report panel -->
      <div class="tab-panel hidden" id="panel-report">
        <div class="report-container" id="report-container">
          <div class="report-empty">
            <div class="report-empty-icon">📄</div>
            <div>The consolidated report will appear here once all agents complete.</div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
